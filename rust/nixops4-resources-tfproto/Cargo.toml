[package]
name = "nixops4-resources-tfproto"
description = "NixOps4 adapter for the tfplugin gRPC protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nixops4-resources-tfproto"
path = "src/main.rs"

[dependencies]
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"
