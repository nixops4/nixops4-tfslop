[package]
name = "nixops4-resources-tfproto"
description = "NixOps4 adapter for the tfplugin gRPC protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nixops4-resources-tfproto"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.45", features = ["io-util", "macros", "net", "process", "rt-multi-thread"] }
tonic = "0.14"
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tokio = { version = "1.45", features = ["io-util", "macros", "net", "process", "rt-multi-thread"] }

[build-dependencies]
tonic-prost-build = "0.14"
